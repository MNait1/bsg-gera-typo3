<nav class="breadcrumb clearfix">
  <div class="wrapper center">
    <div id="rootlineNav">
      <f:if condition="{breadcrumb}">
        <p>
          <f:translate
            key="LLL:EXT:bsggerapackage/Resources/Private/Language/locallang_fe.xlf:templates.page.default.breadcrumb" />
        </p>
        <ul class="menuBreadcrumb">
          <f:for each="{breadcrumb}" as="breadItem">
            <f:render partial="Navigation/BreadcrumbItem" arguments="{breadItem: breadItem}" />
          </f:for>
        </ul>
      </f:if>
    </div>
  </div>
</nav>
