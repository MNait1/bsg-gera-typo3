<f:asset.css identifier="c131Css" href="{cb:assetPath()}/c28.css" />

<!--c28 - two columns list-->
<div class="c28 wrapper center clearfix{f:if(condition: '{data.toggle}', then: ' bottomLine', else: '')}">

    <article>
        <h2>
            <f:if condition="{data.header}">
                {data.header}
            </f:if>
        </h2>
        <f:if condition="{data.listItems}">
            <ol>
                <f:for each="{data.listItems}" as="item" iteration="iterator">
                    <li class="listItem {f:if(condition: '{iterator.isEven}', then: 'even', else: 'odd')}">
                        <f:format.nl2br>{item.text}</f:format.nl2br>
                    </li>
                </f:for>
                <f:if condition="{data.link} && {data.linktext}">
                <li id="link">
                    <f:link.typolink parameter="{data.link}">
                        <f:format.case mode="upper">{data.linktext}</f:format.case>
                    </f:link.typolink>
                </li>
                </f:if>
            </ol>
        </f:if>
    </article>
</div><!-- END c28-->
