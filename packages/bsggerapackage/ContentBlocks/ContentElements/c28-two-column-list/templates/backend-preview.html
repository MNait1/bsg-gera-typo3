<html data-namespace-typo3-fluid="true">

<f:layout name="Preview" />

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">BEARBEITEN</cb:link.editRecord>
</f:section>

<f:section name="Content">
    <h2>{data.header}</h2>
    <ol>
        <f:for each="{data.listItems}" as="li" iteration="iterator">
             <li>
             {li.text}
             </li>
        </f:for>
    </ol>
</f:section>

<f:comment>
<f:section name="Footer">
    
    <f:translate key="{cb:languagePath()}:description" />
</f:section>
</f:comment>

</html>
