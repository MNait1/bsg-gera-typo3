<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers" data-namespace-typo3-fluid="true">

<f:asset.css identifier="titel-videoCSS" href="{cb:assetPath()}/title-video.css" />

<f:if condition="{data.toggle3}">
    <f:then>
        <section class="section background titel-video">
    </f:then>
    <f:else>
        <section class="section background-hellgelb titel-video">
    </f:else>
</f:if>

<div class="wrapper center">
    <f:if condition="{data.toggle}">
        <h3 class="titel-video-header">{data.header}</h3>
    </f:if>

    <div class="video-wrap">
        <f:if condition="{data.media}">
            <f:media file="{data.media.0}" width="800" />
        </f:if>
    </div>

</div>
</section>

</html>
