<html data-namespace-typo3-fluid="true">

<f:layout name="Preview" />

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">BEARBEITEN</cb:link.editRecord>
</f:section>

<f:section name="Content">

    <f:for each="{data.imageL}" as="image" iteration="iterator">
        <f:image image="{image}" width="250" /> -
    </f:for>
    <f:sanitize.html>
        <p>
            <f:format.crop maxCharacters="100" append=" …">{data.textareaL}</f:format.crop>
        </p>
    </f:sanitize.html>

    <f:for each="{data.imageR}" as="image" iteration="iterator">
        <f:image image="{image}" width="250" /> -
    </f:for>
    <f:sanitize.html>
        <p>
            <f:format.crop maxCharacters="100" append=" …">{data.textareaR}</f:format.crop>
        </p>
    </f:sanitize.html>
</f:section>


<f:section name="Footer">
    zazuberlin/two-columns-image-text-image-text
</f:section>

</html>
