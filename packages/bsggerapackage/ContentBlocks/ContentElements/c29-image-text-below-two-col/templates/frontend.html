<f:asset.css identifier="c29Css" href="{cb:assetPath()}/c29.css" />

<!--c29 - col2- image-text image-text-->
<div class="c29 wrapper center clearfix">
    <article>

        <div class="colLeft">
            <f:for each="{data.imageL}" as="image" iteration="iterator">
                <f:image image="{image}" />
            </f:for>
            <div class="txt">
                <f:format.html>{data.textareaL}</f:format.html>

            </div>
            <span class="link">
                <f:link.typolink parameter="{data.linkL}">
                    <f:format.case mode="upper">{data.linktextL}</f:format.case>
                </f:link.typolink>
            </span>
        </div>
        <div class="colRight">
            <f:for each="{data.imageR}" as="image" iteration="iterator">
                <f:image image="{image}" />
            </f:for>
            <div class="txt">
                <f:format.html>{data.textareaR}</f:format.html>

            </div>
            <span class="link">
                <f:link.typolink parameter="{data.linkR}">
                    <f:format.case mode="upper">{data.linktextR}</f:format.case>
                </f:link.typolink>
            </span>
        </div>
    </article>
</div><!-- END c29-->
