<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      data-namespace-typo3-fluid="true">

  <!-- Basis-Styles -->
  <f:asset.css identifier="s1s1CSS" href="{cb:assetPath()}/s1s1.css" />
  <!-- Hero-Styles -->
  <f:asset.css identifier="s2s5CSS" href="{cb:assetPath()}/s2s5.css" />

<div class="hero">
  <h1><f:format.raw>{data.header}</f:format.raw></h1>
  <h2><f:format.raw>{data.header2}</f:format.raw></h2>

  # generate action buttons
  <ul class="actions hero-actions">
    <f:for each="{data.listItems}" as="item" iteration="it">
      <li>
        <f:link.typolink
          parameter="{item.link}"
          class="btn {f:if(condition: it.isFirst, then: 'btn-primary', else: 'btn-ghost')}"
        >
          {item.linktext}
        </f:link.typolink>
      </li>
    </f:for>
  </ul>
</div>


</html>
