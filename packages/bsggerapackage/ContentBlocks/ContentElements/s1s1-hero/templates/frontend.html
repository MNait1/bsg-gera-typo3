<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
  xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers" data-namespace-typo3-fluid="true">

<f:asset.css identifier="s1s1CSS" href="{cb:assetPath()}/s1s1.css" />

<div class="wrapper center">
  <h1>
    <f:format.raw>{data.header}</f:format.raw>
  </h1>
  <h2>
    <f:format.raw>{data.header2}</f:format.raw>
  </h2>

  <ul class="button-list">
    <f:for each="{data.listItems}" as="item" iteration="it">
      <li class="listItem">

        <f:link.typolink parameter="{item.link}">
          <button class="btn">{item.linktext}</button>
        </f:link.typolink>

      </li>
    </f:for>
  </ul>
</div>

</html>
