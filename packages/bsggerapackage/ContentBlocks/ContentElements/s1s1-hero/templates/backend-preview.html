<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Preview" />

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">{data.header}</cb:link.editRecord>
</f:section>

<f:section name="Content">
    <h2>{data.header}</h2>
    <p>
        <f:format.crop maxCharacters="100" append=" …">{data.header2}</f:format.crop>
    </p>
    <ol>
        <f:for each="{data.listItems}" as="item" iteration="it">
            <li>
                <f:link.typolink parameter="{item.link}"
                    class="btn {f:if(condition: it.isFirst, then: 'btn-primary', else: 'btn-ghost')}">
                    {item.linktext}
                </f:link.typolink>
            </li>
        </f:for>
    </ol>
</f:section>


<f:section name="Footer">
    Das erste große Hero Content Element mit Bild, Text und Buttons für die Startseite
</f:section>

</html>
