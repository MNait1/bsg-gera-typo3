<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers" data-namespace-typo3-fluid="true">

<f:asset.css identifier="s0s0CSS" href="{cb:assetPath()}/s0s0.css" />


<f:if condition="{data.toggle2}">

    <f:then>
        <div class="page-bg" aria-hidden="true">
            <f:for each="{data.image}" as="image" iteration="iterator">
                <!-- Nur das erste Bild wird als Hintergrund verwendet -->
                <f:if condition="{iterator.isFirst}"> 
                    <div class="page-bg__image" style="background-image: url('{f:uri.image(image: image)}')"></div>
                </f:if>
            </f:for>
        </div>
    </f:then>
    <f:else>
        <!-- Farbverlauf als Hintergrund, wenn kein Bild aktiv ist -->
        <div class="page-bg2" aria-hidden="true"></div> 
    </f:else>
</f:if> 


</html>
