<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers" data-namespace-typo3-fluid="true">
<f:asset.css identifier="s6s3CSS" href="{cb:assetPath()}/s6s3.css" />

<f:if condition="{data.toggle3}">
    <f:then>
        <section id="fließtext" class="section background">
    </f:then>
    <f:else>
        <section id="fließtext" class="section background2">
    </f:else>
</f:if>
<article class="center wrapper">
    <f:if condition="{data.toggle}">
        <h2 class="text-h2 s6s3header">{data.header}</h2>
    </f:if>
    <div class="s6s3-text-block">
        <div class="text">
            <f:format.html>{data.textarea}</f:format.html>
        </div>
    </div>
</article>
</section>

</html>
