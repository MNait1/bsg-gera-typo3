<f:asset.css identifier="c11Css" href="{cb:assetPath()}/c11.css" />

<!--c11 - 1 column image full width-->

	    <f:for each="{data.image}" as="image" iteration="iterator">
                <f:image image="{image}" />	
            </f:for>
	</figure>
</div><!-- END c11-->
