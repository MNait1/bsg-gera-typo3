<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Preview"/>

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">{data.header}</cb:link.editRecord>
</f:section>

<f:section name="Content">
    <h2>{data.header}</h2>
    <f:sanitize.html><p><f:format.crop maxCharacters="100" append=" …">{data.textarea}</f:format.crop></p></f:sanitize.html>
    <ol>
        <f:for each="{data.listItems}" as="li" iteration="iterator">
             <li>
             {li.text}
             </li>
        </f:for>
    </ol>
</f:section>

<f:comment>
<!-- Uncomment to override preview footer -->
<f:section name="Footer">
    My custom Footer
</f:section>
</f:comment>
</html>
