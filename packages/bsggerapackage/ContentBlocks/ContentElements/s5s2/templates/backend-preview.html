<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Preview"/>

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">{data.header}</cb:link.editRecord>
</f:section>

<f:section name="Content">
    <h2>{data.header}</h2>
    <f:sanitize.html><p><f:format.crop maxCharacters="100" append=" …">{data.textarea1}</f:format.crop></p></f:sanitize.html>
    <f:media file="{data.media.0}" width="250" />

</f:section>





<f:section name="Footer">
    Geben Sie hier ihren Text mit Überschrift ein und fügen Sie ihr Media-Element hinzu.
</f:section>
</html>
