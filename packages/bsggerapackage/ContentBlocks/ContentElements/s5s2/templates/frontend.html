<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers" data-namespace-typo3-fluid="true">

<f:asset.css identifier="s5s2CSS" href="{cb:assetPath()}/s5s2.css" />


<div class="full">
    <div class="container two-col">
        <div class="about-text">
            <f:if condition="{data.header}">
                <h2>{data.header}</h2>
            </f:if>
            <f:format.html>{data.textarea1}</f:format.html>
        </div>

        <div class="video-wrap">
            <f:if condition="{data.media}">
                <f:media file="{data.media.0}" width="500" />
            </f:if>
        </div>


    </div>
</div>

</html>
