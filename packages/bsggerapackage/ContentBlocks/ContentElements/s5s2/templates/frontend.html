<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers" data-namespace-typo3-fluid="true">

<f:asset.css identifier="s5s2CSS" href="{cb:assetPath()}/s5s2.css" />

<f:if condition="{data.toggle3}">
    <f:then>
        <section class="section background" id="about-und-spieler">
    </f:then>
    <f:else>
        <section class="section background-hellblau" id="about-und-spieler">
    </f:else>
</f:if>

    <div class="wrapper center two-col">
        <div class="about-text">
            <f:if condition="{data.header}">
                <h2 class="hell">{data.header}</h2>
            </f:if>
            <div class="textarea">
            <f:format.html>{data.textarea1}</f:format.html>
            </div>
        </div>

        <div class="video-wrap">
            <f:if condition="{data.media}">
                <f:media file="{data.media.0}" width="500" />
            </f:if>
        </div>


    </div>

</section>
</html>
