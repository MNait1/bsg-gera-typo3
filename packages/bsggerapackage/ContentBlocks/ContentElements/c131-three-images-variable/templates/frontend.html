<f:asset.css identifier="c131Css" href="{cb:assetPath()}/c131.css" />


<!--c131 3col images- Container-->
<div class="c131 clearfix wrapper{f:if(condition: '{data.toggleLine}', then: ' bottomLine', else: '')}">
	<div class="center">
		<div class="container">
	        
<f:switch expression="{data.select}">
    <f:case value="1">
        <figure class="even">
            <f:for each="{data.imgLeft}" as="imageL" iteration="iterator">
                <f:image image="{imageL}" />
            </f:for>
            <f:for each="{data.imgMid}" as="imageM" iteration="iterator">
                <f:image image="{imageM}" />
            </f:for>
            <f:for each="{data.imgRight}" as="imageR" iteration="iterator">
                <f:image image="{imageR}" />
            </f:for>
        </figure>
    </f:case>
    <f:case value="2">
        <figure class="leftBig">
            <div class="leftColBig">
                <f:for each="{data.imgLeft}" as="imageL" iteration="iterator">
                    <f:image image="{imageL}" />
                </f:for>
            </div>
            <div class="rightColSmall">
                <f:for each="{data.imgMid}" as="imageM" iteration="iterator">
                    <f:image image="{imageM}" />
                </f:for>
                <f:for each="{data.imgRight}" as="imageR" iteration="iterator">
                    <f:image image="{imageR}" />
                </f:for>
            </div>
        </figure>
    </f:case>
    <f:case value="3">
        <figure class="leftSmall">
            <div class="leftColSmall">
                <f:for each="{data.imgLeft}" as="imageL" iteration="iterator">
                    <f:image image="{imageL}" alt="" />
                </f:for>
                <f:for each="{data.imgMid}" as="imageM" iteration="iterator">
                    <f:image image="{imageM}" alt="" />
                </f:for>
            </div>
            <div class="rightColBig">
                <f:for each="{data.imgRight}" as="imageR" iteration="iterator">
                    <f:image image="{imageR}" alt="" />
                </f:for>
            </div>
        </figure>
    </f:case>
    <f:defaultCase>
        <figure class="even">
            <f:for each="{data.imgLeft}" as="imageL" iteration="iterator">
                <f:image image="{imageL}" alt="" />
            </f:for>
            <f:for each="{data.imgMid}" as="imageM" iteration="iterator">
                <f:image image="{imageM}" alt="" />
            </f:for>
            <f:for each="{data.imgRight}" as="imageR" iteration="iterator">
                <f:image image="{imageR}" alt="" />
            </f:for>
        </figure>
    </f:defaultCase>
</f:switch>



		</div>
	</div>
</div>
