<f:asset.css identifier="c23Css" href="{cb:assetPath()}/c23.css" />

<!--c23 - col2ImgTxt-->
<div class="c23 wrapper center clearfix{f:if(condition: '{data.toggleLine}', then: ' bottomLine', else: '')}">
    <article>
        <f:if condition="{data.toggle}">
            <h2 class="overAll">{data.header}</h2>
        </f:if>
        <div class="container">
        <div class="leftCol">
            <f:for each="{data.image}" as="image" iteration="iterator">
                <f:image image="{image}" />
            </f:for>
        </div>
        <div class="rightCol">
            <f:format.html>{data.textarea}</f:format.html>

            <f:if condition="{data.linktext}">
                <p class="link">
                    <f:link.typolink parameter="{data.link}">
                        <f:format.case mode="upper">{data.linktext}</f:format.case>
                    </f:link.typolink>
                </p>
            </f:if>
        </div>
        </div>
    </article>
</div><!-- END c23-->
